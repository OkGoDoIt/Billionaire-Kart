# Billionaire Kart on the shared side-projects host. Installed by ops/deploy.sh --setup as
# /etc/nginx/sites-available/billionaire-kart. Owns only this hostname.
# The game itself is plain files served from the active release; the app answers /api, /ws, /admin, /healthz, and
# /s/ (shared results: a link preview page and its picture).
map $http_upgrade $bkart_connection { default upgrade; '' ''; }

server {
  listen 80; listen [::]:80;
  server_name billionaire-kart.okgodoit.com;
  location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
  location / { return 308 https://billionaire-kart.okgodoit.com$request_uri; }
}

server {
  listen 443 ssl; listen [::]:443 ssl;
  http2 on;
  server_name billionaire-kart.okgodoit.com;
  ssl_certificate /etc/letsencrypt/live/billionaire-kart/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/billionaire-kart/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  access_log /var/log/nginx/billionaire-kart.access.log roger_paths;
  error_log /var/log/nginx/billionaire-kart.error.log;
  client_max_body_size 64k;
  add_header X-Content-Type-Options nosniff always;

  root /srv/billionaire-kart/current;
  index index.html;
  gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  # Code is always revalidated (the game has no build step, so file names never change);
  # art, audio, and fonts may be reused for an hour, and the game's own offline cache keeps them longer.
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location ~* \.(webp|png|jpg|jpeg|mp3|ogg|woff2)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location = /ws {
    proxy_pass http://127.0.0.1:5105;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $bkart_connection;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 75s;      # the game pings every 5 s; a silent socket is a dead one
    proxy_send_timeout 75s;
  }
  location ~ ^/(api|admin)(/|$) {
    proxy_pass http://127.0.0.1:5105;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  # A shared result's link and its preview picture. ^~ keeps the picture rule above from catching /s/<id>.jpg.
  location ^~ /s/ {
    proxy_pass http://127.0.0.1:5105;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 20s;      # a previewer can arrive before the upload; the app waits a few seconds for it
  }
  # The share upload carries the card picture (about 120 KB); the app enforces its own limit (/admin/settings).
  location = /api/shares {
    client_max_body_size 6m;
    proxy_pass http://127.0.0.1:5105;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location = /healthz {
    proxy_pass http://127.0.0.1:5105;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
