# Runs the headless sim, a short blocking boot check, and the browser bot on every pull request to main and every
# push to main (#91). A push to main publishes the game to GitHub Pages only after every blocking check passes, and
# it publishes only the folder tools/build-site.mjs assembles (no docs, tools, or PR screenshots).
# Bot screenshots are uploaded as an artifact when anything fails, so a red check can be diagnosed from the run page.
name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim-and-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    # the online server's tests use a real database
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Race behavior and all-track simulation
        run: npm run test:race

      # Blocking: rooms, ownership, relay, ratings, and admin, over real WebSockets against Postgres.
      - name: Online server
        env:
          BK_TEST_PG: Host=localhost;Username=postgres;Password=postgres
        run: dotnet test server --nologo

      # Blocking: two simulated devices race through an in-memory relay; offline play must match main step for step.
      - name: Online racing
        run: node tools/net-check.mjs

      - name: Audio playback
        run: node tools/audio-check.mjs

      # Blocking: the page boots to the title, reaches the main menu, and a race runs, with no page errors or 404s.
      - name: Page boots
        run: node tools/boot-check.mjs

      - name: Service worker updates and offline start
        run: node tools/sw-check.mjs --out bot-shots/sw

      # The exact folder that will be published, booted the same way, so a file left out of the site fails here.
      - name: Assemble and boot the site
        run: npm run site && node tools/boot-check.mjs --root _site

      - name: Upload the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # The bot races in real time; a GPU-less runner renders too slowly for its timing asserts, so on CI it is
      # advisory (screenshots always uploaded). The full bot gate runs locally before every push (CONTRIBUTING.md).
      - name: Bot, desktop (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node tools/bot.mjs --out bot-shots/desktop

      - name: Bot, mobile (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node tools/bot.mjs --mobile --out bot-shots/mobile

      - name: Upload bot screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots
          path: bot-shots/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: sim-and-bot
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The game's home, billionaire-kart.okgodoit.com, gets the same tested commit: the online server first (when the
  # commit has one), then the game files, in one request. If the new server is not healthy, it is rolled back and
  # the game files are not swapped, so the live client never runs ahead of its server. GitHub's key there can only
  # upload a release and ask for a commit to be installed (ops/site-deploy/).
  deploy-okgodoit:
    needs: sim-and-bot
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: okgodoit-deploy
      cancel-in-progress: false
    environment:
      name: okgodoit
      url: https://billionaire-kart.okgodoit.com/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET for the online server
        if: hashFiles('server/**/*.csproj') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Deploy to billionaire-kart.okgodoit.com
        env:
          DEPLOY_KEY: ${{ secrets.OKGODOIT_DEPLOY_KEY }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::OKGODOIT_DEPLOY_KEY is not set, so billionaire-kart.okgodoit.com was not updated (ops/site-deploy/README.md)"; exit 1; fi
          # a newer push to main is already on its way: let that one deploy instead of rolling back
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$SHA" ]; then echo "main has moved on to $head; skipping $SHA"; exit 0; fi
          mkdir -p _upload
          node tools/build-site.mjs _upload/site && echo "$SHA" > _upload/site/version.txt
          # The server ships only when what it is built from changed since the commit it reports, because a restart
          # drops live online rooms. Its inputs: server/src and the handle list it embeds. Unknown? Ship it.
          server=""
          if ls server/src/*/*.Server.csproj >/dev/null 2>&1; then
            running=$(curl -fsS https://billionaire-kart.okgodoit.com/healthz | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))' 2>/dev/null || true)
            if [ -n "$running" ] && git fetch -q --depth=1 origin "$running" 2>/dev/null && git diff --quiet "$running" "$SHA" -- server/src src/content/handles.js; then
              echo "the live server (${running:0:7}) is built from the same sources; leaving it running"
            else
              echo "the server changed since ${running:0:7}; shipping it with this deploy"
              for proj in server/src/*/*.Server.csproj; do dotnet publish "$proj" -c Release -o _upload/server --nologo -v quiet; done
              server=1
            fi
          fi
          install -m 600 /dev/null ~/deploy_key && printf '%s\n' "$DEPLOY_KEY" > ~/deploy_key
          ssh_cmd="ssh -i $HOME/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$PWD/ops/site-deploy/known_hosts"
          rsync -rt --chmod=D755,F644 -e "$ssh_cmd" _upload/ "billionaire-kart-deploy@178.128.11.103:$SHA/"
          # The installer goes live with the newest request only; one that a later push overtook reports "superseded".
          result=$($ssh_cmd billionaire-kart-deploy@178.128.11.103 "activate $SHA") || status=$?
          echo "$result"
          if echo "$result" | grep -q '"superseded"'; then echo "a newer push was requested while $SHA waited; it deploys instead"; exit 0; fi
          [ -z "${status:-}" ] || { echo "::error::the installer refused $SHA"; exit 1; }
          # Check from outside, past any cache, that the domain really serves this commit.
          for i in $(seq 1 12); do
            live=$(curl -fsS -H 'Cache-Control: no-cache' "https://billionaire-kart.okgodoit.com/version.txt?check=$SHA-$i" || true)
            health=$(curl -fsS -H 'Cache-Control: no-cache' "https://billionaire-kart.okgodoit.com/healthz?check=$SHA-$i" || true)
            if [ "$live" = "$SHA" ] && { [ -z "$server" ] || echo "$health" | grep -q "$SHA"; }; then
              echo "live at https://billionaire-kart.okgodoit.com/ ($SHA${server:+, server included})"; exit 0
            fi
            sleep 5
          done
          echo "::error::the site reports ${live:-nothing}${server:+ and the server reports ${health:-nothing}} instead of $SHA"; exit 1
