# Runs the headless sim and the browser bot on every pull request to main and every push to main (#91).
# The bot walks the menus, races on autopilot, and fails on page errors, unrendered text, or screens that overflow.
# Bot screenshots are uploaded as an artifact when anything fails, so a red check can be diagnosed from the run page.
name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim-and-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Sim
        run: node tools/sim.mjs --quick

      # The bot races in real time; a GPU-less runner renders too slowly for its timing asserts, so on CI it is
      # advisory (screenshots always uploaded). The full bot gate runs locally before every push (CONTRIBUTING.md).
      - name: Bot, desktop (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node tools/bot.mjs --out bot-shots/desktop

      - name: Bot, mobile (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node tools/bot.mjs --mobile --out bot-shots/mobile

      - name: Upload bot screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots
          path: bot-shots/
          if-no-files-found: ignore
          retention-days: 14
