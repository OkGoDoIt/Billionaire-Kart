<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Billionaire Kart — gfx pipeline demo</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}
#tag{position:fixed;left:10px;top:8px;color:#fff;font:600 13px system-ui;text-shadow:0 1px 3px #000;z-index:2}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="tag"></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as TEX from './textures.js';
import * as MAT from './materials.js';
import { setupRenderer, applySky, setupLights, SKY_URLS } from './environment.js';
import { createPost } from './post.js';

const mode = new URLSearchParams(location.search).get('mode') || 'full';
const FULL = mode === 'full';
document.getElementById('tag').textContent = FULL ? 'GFX PIPELINE' : 'CURRENT STYLE';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
if (FULL) setupRenderer(renderer);
else { renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace; }

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 900);
camera.position.set(9.5, 5.2, 11.5);
camera.lookAt(0, 1.0, 0);

let waterMat = null, post = null;

if (FULL) {
  applySky(renderer, scene, '../' + SKY_URLS.valley, { envIntensity: 0.5 }).then(() => { window.__skyReady = true; });
  scene.fog = new THREE.Fog(0xcfe4f7, 240, 720);
  setupLights(scene, { radius: 90, shadowMapSize: 2048 });
} else {
  scene.background = new THREE.Color(0x87b5d9);
  scene.fog = new THREE.Fog(0x87b5d9, 210, 640);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7d33, 1.05));
  const sun = new THREE.DirectionalLight(0xfff2d8, 1.9);
  sun.position.set(70, 115, 45); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -90, right: 90, top: 90, bottom: -90, near: 10, far: 420 });
  scene.add(sun); scene.add(sun.target);
}

const lam = (color, opts = {}) => new THREE.MeshLambertMaterial({ color, ...opts });
const std = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, ...opts });

/* ---- ground: grass + asphalt strip ---- */
{
  let groundMat, roadMat;
  if (FULL) {
    const grass = TEX.grassTexture(); grass.repeat.set(24, 24);
    groundMat = new THREE.MeshStandardMaterial({ map: grass, roughness: 1, envMapIntensity: 0.4 });
    const a = TEX.asphaltTextures();
    a.map.repeat.set(1, 10); a.roughnessMap.repeat.set(1, 10); a.bumpMap.repeat.set(1, 10);
    roadMat = new THREE.MeshStandardMaterial({ map: a.map, roughnessMap: a.roughnessMap, bumpMap: a.bumpMap, bumpScale: 0.8, roughness: 1, envMapIntensity: 0.35 });
  } else {
    groundMat = lam(0x4a7d33);
    roadMat = lam(0x34373d);
  }
  const ground = new THREE.Mesh(new THREE.CircleGeometry(300, 40), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(13, 300), roadMat);
  road.rotation.x = -Math.PI / 2; road.position.y = 0.03; road.receiveShadow = true; scene.add(road);
  // start-line checker
  const chk = document.createElement('canvas'); chk.width = chk.height = 64;
  const g2 = chk.getContext('2d');
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { g2.fillStyle = (x + y) % 2 ? '#111' : '#f5f5f5'; g2.fillRect(x * 8, y * 8, 8, 8); }
  const chkTex = new THREE.CanvasTexture(chk); chkTex.colorSpace = THREE.SRGBColorSpace;
  const line = new THREE.Mesh(new THREE.PlaneGeometry(13, 3.4), FULL ? std(0xffffff, { map: chkTex, roughness: 0.7 }) : lam(0xffffff, { map: chkTex }));
  line.rotation.x = -Math.PI / 2; line.position.set(0, 0.05, 6.5); line.receiveShadow = true; scene.add(line);
}

/* ---- hero kart ---- */
{
  const kart = new THREE.Group();
  const paint = FULL ? MAT.kartPaint(0xd23b2e) : lam(0xd23b2e);
  const bodyGeo = FULL ? new RoundedBoxGeometry(2.3, 0.62, 3.6, 4, 0.16) : new THREE.BoxGeometry(2.3, 0.62, 3.6);
  const body = new THREE.Mesh(bodyGeo, paint); body.position.y = 0.62; body.castShadow = true; kart.add(body);
  const nose = new THREE.Mesh(FULL ? new RoundedBoxGeometry(1.5, 0.4, 1.1, 3, 0.12) : new THREE.BoxGeometry(1.5, 0.4, 1.1), paint);
  nose.position.set(0, 0.5, 2.2); nose.castShadow = true; kart.add(nose);
  const seat = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.85, 0.35), FULL ? MAT.mattePlastic(0x191b20) : lam(0x191b20));
  seat.position.set(0, 1.05, -1.05); seat.castShadow = true; kart.add(seat);
  const spoiler = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 0.55), FULL ? MAT.carbonFibre({ repeat: 4 }) : lam(0x22242c));
  spoiler.position.set(0, 1.28, -1.85); spoiler.castShadow = true; kart.add(spoiler);
  const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.8, 12), FULL ? MAT.chrome() : lam(0xb9c0c7));
  pipe.rotation.x = Math.PI / 2; pipe.position.set(0.55, 0.52, -2.05); kart.add(pipe);
  const wheelGeo = new THREE.CylinderGeometry(0.52, 0.52, 0.42, 22);
  const wheelMat = FULL ? MAT.rubber({}) : lam(0x14151a);
  const hubMat = FULL ? MAT.chrome({ roughness: 0.25 }) : lam(0x9aa0a3);
  for (const [x, z, s] of [[-1.15, 1.25, 1], [1.15, 1.25, 1], [-1.15, -1.3, 1.18], [1.15, -1.3, 1.18]]) {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2; w.position.set(x, 0.52 * s, z); w.scale.setScalar(s); w.castShadow = true; kart.add(w);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.44, 14), hubMat);
    hub.rotation.z = Math.PI / 2; hub.position.copy(w.position); hub.scale.setScalar(s); kart.add(hub);
  }
  // driver: bobblehead + face (full) vs plain sphere (plain)
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.52, 22, 18), FULL ? MAT.skinTone(0xf2c49b) : lam(0xf2c49b));
  head.position.set(0, 1.98, -0.55); head.castShadow = true; kart.add(head);
  if (FULL) {
    const fc = document.createElement('canvas'); fc.width = fc.height = 128;
    const g = fc.getContext('2d');
    g.fillStyle = '#f2c49b'; g.fillRect(0, 0, 128, 128);
    g.fillStyle = '#20222a';
    g.beginPath(); g.arc(44, 56, 7, 0, 7); g.fill(); g.beginPath(); g.arc(84, 56, 7, 0, 7); g.fill();
    g.strokeStyle = '#20222a'; g.lineWidth = 5; g.lineCap = 'round';
    g.beginPath(); g.arc(64, 76, 20, 0.35, Math.PI - 0.35); g.stroke();
    g.fillStyle = '#3a2c20'; g.fillRect(14, 0, 100, 26); // hair band
    const faceTex = new THREE.CanvasTexture(fc); faceTex.colorSpace = THREE.SRGBColorSpace;
    const face = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 0.78), new THREE.MeshStandardMaterial({ map: faceTex, transparent: false, roughness: 0.6 }));
    face.position.set(0, 1.98, -0.55 + 0.5); face.rotation.x = -0.06; kart.add(face);
  }
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.44, 0.85, 12), FULL ? MAT.mattePlastic(0x2456c8) : lam(0x2456c8));
  torso.position.set(0, 1.35, -0.6); torso.castShadow = true; kart.add(torso);
  kart.position.set(-1.6, 0, 2.2); kart.rotation.y = -0.35;
  scene.add(kart);
}

/* ---- props: server block, LED sign, water pool, clouds, sparkles ---- */
{
  const block = new THREE.Mesh(new THREE.BoxGeometry(7, 9, 5), FULL ? MAT.metalPanels({ repeat: 2 }) : lam(0x8d97a3));
  block.position.set(-14, 4.5, -12); block.castShadow = true; block.receiveShadow = true; scene.add(block);
  const led = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 1.6),
    FULL ? MAT.emissiveScreen(0x33ffcc, { intensity: 2.2 }) : std(0x0a2a22, { emissive: 0x33ffcc, emissiveIntensity: 0.55 }));
  led.position.set(-14, 7.6, -9.45); scene.add(led);

  if (FULL) {
    waterMat = MAT.waterMaterial(0x1d5f7a, { repeat: 8 });
    const pool = new THREE.Mesh(new THREE.CircleGeometry(7, 30), waterMat);
    pool.rotation.x = -Math.PI / 2; pool.position.set(13.5, 0.06, 4); pool.receiveShadow = true; scene.add(pool);

    const cloudTex = TEX.cloudSprite();
    for (let i = 0; i < 7; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex, transparent: true, opacity: 0.85, depthWrite: false }));
      s.position.set(-60 + i * 19, 26 + (i % 3) * 5, -55 - (i % 4) * 12);
      s.scale.set(26, 11, 1); scene.add(s);
    }
    const pGeo = new THREE.BufferGeometry();
    const N = 90, pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) { pos[i * 3] = (Math.random() - 0.5) * 30; pos[i * 3 + 1] = Math.random() * 7 + 0.4; pos[i * 3 + 2] = (Math.random() - 0.5) * 30; }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const pts = new THREE.Points(pGeo, new THREE.PointsMaterial({ map: TEX.particleSprite(), size: 0.3, transparent: true, opacity: 0.5, depthWrite: false, color: 0xffe9a8, blending: THREE.AdditiveBlending }));
    scene.add(pts);
  } else {
    const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.88 });
    for (let i = 0; i < 5; i++) {
      const c = new THREE.Mesh(new THREE.SphereGeometry(3.4, 10, 8), cloudMat);
      c.scale.y = 0.45; c.position.set(-50 + i * 24, 27, -60); scene.add(c);
    }
  }
}

if (FULL) post = createPost(renderer, scene, camera);
let frames = 0;
const t0 = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const t = (performance.now() - t0) / 1000;
  if (waterMat) MAT.animateWater(waterMat, t);
  if (post) post.render(); else renderer.render(scene, camera);
  if (++frames === 12) window.__gfxReady = { mode, full: FULL };
}
loop();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (post) post.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
